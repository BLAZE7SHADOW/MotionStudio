<!doctype html>
<!--
  Source for the generated og:image/twitter:image — see generate-og-image.mjs.

  Deliberately not part of the Vite app: this never ships as a route, it only
  ever gets one screenshot taken of it. Colours and the dot-grid are the exact
  values from src/index.css and LandingPage.tsx's hero section, kept in sync
  by hand rather than importing the real stylesheet, since this file is loaded
  via file:// by a script, not built by Vite.

  A clean, on-brand placeholder, not a product screenshot — replace the
  generation source (this file) freely; nothing else in the SEO setup
  changes when a real screenshot-based image eventually replaces it.
-->
<html>
<head>
<meta charset="UTF-8" />
<style>
  @font-face {
    font-family: 'Bricolage Grotesque Variable';
    src: url('../node_modules/@fontsource-variable/bricolage-grotesque/files/bricolage-grotesque-latin-wght-normal.woff2') format('woff2-variations');
    font-weight: 200 800;
  }
  @font-face {
    font-family: 'Geist Variable';
    src: url('../node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2') format('woff2-variations');
    font-weight: 100 900;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1200px;
    height: 630px;
    background: oklch(0.145 0.005 285.786); /* --studio-bg */
    background-image: radial-gradient(circle, oklch(1 0 0 / 6%) 1px, transparent 1px);
    background-size: 24px 24px;
    font-family: 'Geist Variable', ui-sans-serif, sans-serif;
    overflow: hidden;
  }
  .glow {
    position: absolute;
    top: -80px;
    left: 50%;
    transform: translateX(-50%);
    width: 900px;
    height: 560px;
    background: radial-gradient(ellipse at center, oklch(0.627 0.265 298.232 / 22%), transparent 70%);
  }
  .content {
    position: relative;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  .badge {
    font-size: 15px;
    font-weight: 500;
    color: oklch(0.627 0.265 298.232); /* --studio-accent */
    background: oklch(0.627 0.265 298.232 / 12%); /* --studio-accent-subtle */
    border: 1px solid oklch(0.627 0.265 298.232 / 28%); /* --studio-accent-border */
    padding: 8px 20px;
    border-radius: 999px;
    margin-bottom: 28px;
  }
  h1 {
    font-family: 'Bricolage Grotesque Variable', 'Geist Variable', sans-serif;
    font-weight: 600;
    font-size: 108px;
    line-height: 1;
    letter-spacing: -0.02em;
    color: oklch(0.985 0 0); /* --studio-text */
    margin-bottom: 22px;
  }
  h1 .accent { color: oklch(0.627 0.265 298.232); }
  p {
    font-size: 32px;
    font-weight: 400;
    color: oklch(0.705 0.015 286.067); /* --studio-text-secondary */
    max-width: 760px;
  }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="content">
    <span class="badge">Browser-based &middot; No install needed</span>
    <h1>Motion<span class="accent">Studio</span></h1>
    <p>Motion graphics, frame by frame &mdash; built in your browser.</p>
  </div>
</body>
</html>
